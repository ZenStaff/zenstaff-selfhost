name: Bug report
description: Something in the self-hosted hub or memory does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problems go to security@zenstaff.app, not here. Remove secrets, e-mail addresses and company data from logs before pasting them."
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit of this repository (`git describe --tags --always`).
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: ["hub", "memory", "docker compose / install", "backups / upgrades", "other"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail 200 <service>` (secrets removed)"
      render: text

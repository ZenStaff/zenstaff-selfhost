# Zen Staff self-host: the team hub + company memory on your own server.
#
#   cp .env.example .env && scripts/gen-secrets.sh     (fills in every secret)
#   docker compose up -d --build                        (hub, memory API, Neo4j)
#
# Optional profiles (COMPOSE_PROFILES in .env, comma-separated):
#   https           Caddy in front, with automatic HTTPS for HUB_DOMAIN and MEMORY_DOMAIN
#   local-embedder  embeddings on this machine (TEI + Qwen3-Embedding-0.6B, ~3.5 GB RAM, no per-call cost)
#
# Everything listens on 127.0.0.1 unless you change HUB_BIND / MEMORY_BIND or use the https profile.
# Configure everything in .env (documented in .env.example); this file needs no edits.
name: ${COMPOSE_PROJECT_NAME:-zenstaff}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  hub:
    build: ./hub
    image: ${COMPOSE_PROJECT_NAME:-zenstaff}-hub:local
    restart: unless-stopped
    logging: *logging
    environment:
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:?set HUB_PUBLIC_URL in .env}
      HUB_SECRET_KEY: ${HUB_SECRET_KEY:?set HUB_SECRET_KEY in .env (scripts/gen-secrets.sh)}
      HUB_PLAN: selfhost
      HUB_ADMIN_EMAILS: ${HUB_ADMIN_EMAILS:-}
      HUB_MAIL_FROM: ${HUB_MAIL_FROM:-Zen Staff <no-reply@example.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      HUB_SMTP_HOST: ${HUB_SMTP_HOST:-}
      HUB_SMTP_PORT: ${HUB_SMTP_PORT:-}
      HUB_SMTP_SECURE: ${HUB_SMTP_SECURE:-}
      HUB_SMTP_USER: ${HUB_SMTP_USER:-}
      HUB_SMTP_PASSWORD: ${HUB_SMTP_PASSWORD:-}
      HUB_SMTP_ALLOW_PLAIN: ${HUB_SMTP_ALLOW_PLAIN:-}
      HUB_CLIENT_IP_HEADER: ${HUB_CLIENT_IP_HEADER:-}
      HUB_GOOGLE_CLIENT_ID: ${HUB_GOOGLE_CLIENT_ID:-}
      HUB_GOOGLE_CLIENT_SECRET: ${HUB_GOOGLE_CLIENT_SECRET:-}
      HUB_MICROSOFT_CLIENT_ID: ${HUB_MICROSOFT_CLIENT_ID:-}
      HUB_MICROSOFT_CLIENT_SECRET: ${HUB_MICROSOFT_CLIENT_SECRET:-}
      HUB_MICROSOFT_TENANT: ${HUB_MICROSOFT_TENANT:-common}
      HUB_WEBAUTHN_RP_ID: ${HUB_WEBAUTHN_RP_ID:-}
      HUB_WEBAUTHN_RP_NAME: ${HUB_WEBAUTHN_RP_NAME:-}
      HUB_WEBAUTHN_ORIGIN: ${HUB_WEBAUTHN_ORIGIN:-}
      HUB_WRITE_LIMIT_PER_MINUTE: ${HUB_WRITE_LIMIT_PER_MINUTE:-120}
      HUB_APPROVALS_COMPANY_MB: ${HUB_APPROVALS_COMPANY_MB:-}
      HUB_SIEM_ALLOW_PRIVATE: ${HUB_SIEM_ALLOW_PRIVATE:-}
      HUB_AUDIT_ANCHOR_URL: ${HUB_AUDIT_ANCHOR_URL:-}
      HUB_LIBRARY_REVIEWERS: ${HUB_LIBRARY_REVIEWERS:-}
      # Company memory: the hub creates one memory space per company and hands each machine its own key.
      HUB_MEMORY_URL: ${MEMORY_PUBLIC_URL:-}
      HUB_MEMORY_ADMIN_URL: http://memory:8000
      HUB_MEMORY_ADMIN_TOKEN: ${MEMORY_ADMIN_TOKEN:?set MEMORY_ADMIN_TOKEN in .env (scripts/gen-secrets.sh)}
    volumes:
      - hub-data:/data
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8787}:8787"
    depends_on:
      memory:
        condition: service_healthy
    mem_limit: ${HUB_MEM_LIMIT:-512m}

  memory:
    build: ./memory
    image: ${COMPOSE_PROJECT_NAME:-zenstaff}-memory:local
    restart: unless-stopped
    logging: *logging
    environment:
      TENANCY: multi
      ADMIN_TOKEN: ${MEMORY_ADMIN_TOKEN:?set MEMORY_ADMIN_TOKEN in .env}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      DATA_DIR: /data
      GRAPHITI_TELEMETRY_ENABLED: "false"
      ZM_MASTER_KEYS: ${ZM_MASTER_KEYS:-}
      ZM_MASTER_KEY_ID: ${ZM_MASTER_KEY_ID:-}
      ENCRYPTION: ${ENCRYPTION:-required}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-low}
      LLM_PRICE_IN_PER_MTOK: ${LLM_PRICE_IN_PER_MTOK:-0.10}
      LLM_PRICE_OUT_PER_MTOK: ${LLM_PRICE_OUT_PER_MTOK:-0.50}
      LLM_PROMPT_CACHE: ${LLM_PROMPT_CACHE:-on}
      LLM_CACHE_TTL: ${LLM_CACHE_TTL:-1h}
      LLM_BATCH: ${LLM_BATCH:-off}
      LLM_STEP_MODELS: ${LLM_STEP_MODELS:-}
      EMBEDDER_PROVIDER: ${EMBEDDER_PROVIDER:-openai}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:80/v1}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDER_API_KEY: ${EMBEDDER_API_KEY:-none}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDER_QUERY_INSTRUCTION: ${EMBEDDER_QUERY_INSTRUCTION:-}
      CF_AI_ACCOUNT_ID: ${CF_AI_ACCOUNT_ID:-}
      CF_AI_API_TOKEN: ${CF_AI_API_TOKEN:-}
      CF_EMBED_MODEL: ${CF_EMBED_MODEL:-@cf/qwen/qwen3-embedding-0.6b}
      QUOTA_EPISODES_PER_DAY: ${QUOTA_EPISODES_PER_DAY:-500}
      QUOTA_INGEST_TOKENS_PER_MONTH: ${QUOTA_INGEST_TOKENS_PER_MONTH:-30000000}
      QUOTA_SEARCHES_PER_MINUTE: ${QUOTA_SEARCHES_PER_MINUTE:-120}
      QUOTA_PERSON_EPISODES_PER_DAY: ${QUOTA_PERSON_EPISODES_PER_DAY:-100}
      QUOTA_PERSON_INGEST_TOKENS_PER_MONTH: ${QUOTA_PERSON_INGEST_TOKENS_PER_MONTH:-3000000}
      QUOTA_PERSON_SEARCHES_PER_MINUTE: ${QUOTA_PERSON_SEARCHES_PER_MINUTE:-60}
      QUOTA_ALERT_WEBHOOK_URL: ${QUOTA_ALERT_WEBHOOK_URL:-}
      QUOTA_ALERT_WEBHOOK_FORMAT: ${QUOTA_ALERT_WEBHOOK_FORMAT:-json}
      AUDIT_TRUSTED_PROXIES: ${AUDIT_TRUSTED_PROXIES:-}
    volumes:
      - memory-data:/data
    ports:
      - "${MEMORY_BIND:-127.0.0.1}:${MEMORY_PORT:-8740}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      embedder:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    mem_limit: ${MEMORY_MEM_LIMIT:-768m}

  neo4j:
    image: neo4j:5.26.33-community
    restart: unless-stopped
    logging: *logging
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
      NEO4J_server_jvm_additional: -XX:+ExitOnOutOfMemoryError
      # Transaction logs keep old values of changed or deleted facts until they rotate away.
      NEO4J_db_tx__log_rotation_retention__policy: ${NEO4J_TX_LOG_RETENTION:-2 days}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: ${NEO4J_MEM_LIMIT:-1536m}

  embedder:
    profiles: ["local-embedder"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    logging: *logging
    command: ["--model-id", "${EMBEDDER_MODEL:-Qwen/Qwen3-Embedding-0.6B}", "--max-client-batch-size", "32",
              "--max-batch-tokens", "${EMBEDDER_MAX_BATCH_TOKENS:-512}", "--auto-truncate"]
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAYON_NUM_THREADS: ${EMBEDDER_THREADS:-4}
    volumes:
      - embedder-models:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    mem_limit: ${EMBEDDER_MEM_LIMIT:-4g}

  caddy:
    profiles: ["https"]
    image: caddy:2.10.2
    restart: unless-stopped
    logging: *logging
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:-}
      MEMORY_DOMAIN: ${MEMORY_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub
      - memory
    mem_limit: 256m

volumes:
  hub-data:
  memory-data:
  neo4j-data:
  neo4j-logs:
  embedder-models:
  caddy-data:
  caddy-config:
